<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Find links to a specific page</title>
	<link rel="shortcut icon" href="https://dc.gov/sites/default/files/favicon_0.ico" type="image/vnd.microsoft.icon" />
	<style>
		:root {
			/* Light theme palette */
			--bg: #ffffff;
			--panel: #f8fafc;
			--text: #0f172a;
			--muted: #334155;
			--accent: #2563eb;
			--border: #e2e8f0;
			--ok: #16a34a;
			--warn: #d97706;
			--err: #dc2626;
			--link: #1d4ed8;
			--link-hover: #1e40af;
		}
		* { box-sizing: border-box; }
		body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--text); }
		header { padding: 24px 20px; max-width: 1000px; margin: 0 auto; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(37,99,235,.5), rgba(37,99,235,0)); }
		h1 { margin: 0; font-size: 1.6rem; }
		main { padding: 20px; max-width: 1000px; margin: 0 auto; }
		.grid { display: grid; gap: 12px; }
		.field { display: grid; grid-template-columns: 240px 1fr; gap: 10px; align-items: center; }
		label { color: var(--muted); }
		input[type="text"], input[type="file"] { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
		input[type="text"]::placeholder { color: #b0b6be; }
		button { appearance: none; border: 1px solid var(--accent); padding: 10px 16px; border-radius: 8px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
		button:hover { filter: brightness(1.05); }
		button:disabled { opacity: .6; cursor: not-allowed; }
		.status { margin-top: 8px; font-size: .95rem; }
		.status.ok { color: var(--ok); }
		.status.warn { color: var(--warn); }
		.status.err { color: var(--err); }

		/* New: alias list container */
		#aliasContainer { margin-top: 6px; }
		#aliasContainer p { margin: 8px 0 4px; color: var(--muted); }
		#aliasContainer ul { margin: 4px 0 0 18px; }

		table { width: 100%; border-collapse: collapse; margin-top: 18px; display: none; background: var(--panel); border: 1px solid var(--border); }
		thead th { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: .95rem; color: var(--muted); }
		tbody td { vertical-align: top; padding: 10px; border-top: 1px solid var(--border); }
		a { color: var(--link); text-decoration: none; }
		a:hover { text-decoration: underline; color: var(--link-hover); }

		ul { margin: 6px 0 0 18px; }
		.sr-only { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
	</style>
</head>
<body>
	<header>
		<h1>Find links to a specific page</h1>
	</header>

	<main>
		<div class="grid">
			<form id="whatLinksHereForm">
				<div class="field">
					<p>Select agency<br>(more will be added later)</p>
					<fieldset id="agencyInitialsFieldset">
						<input type="radio" name="agencyInitials" value="DCPS" id="agencyInitialsDCPS"/>
						<label for="agencyInitialsDCPS">DCPS</label>

						<input type="radio" name="agencyInitials" value="DHCF" id="agencyInitialsDHCF"/>
						<label for="agencyInitialsDHCF">DHCF</label>

						<input type="radio" name="agencyInitials" value="DHS" id="agencyInitialsDHS"/>
						<label for="agencyInitialsDHS">DHS</label>

						<input type="radio" name="agencyInitials" value="DMV" id="agencyInitialsDMV"/>
						<label for="agencyInitialsDMV">DMV</label>

						<input type="radio" name="agencyInitials" value="DOB" id="agencyInitialsDOB"/>
						<label for="agencyInitialsDOB">DOB</label>

						<input type="radio" name="agencyInitials" value="DOES" id="agencyInitialsDOES"/>
						<label for="agencyInitialsDMV">DOES</label>

						<input type="radio" name="agencyInitials" value="OCTO" id="agencyInitialsOCTO"/>
						<label for="agencyInitialsOCTO">OCTO</label>

						<input type="radio" name="agencyInitials" value="OUC" id="agencyInitialsOUC"/>
						<label for="agencyInitialsOUC">OUC</label>

						<input type="radio" name="agencyInitials" value="OTR" id="agencyInitialsOTR"/>
						<label for="agencyInitialsOTR">OTR</label>
					</fieldset>
				</div>

				<!-- Target URL -->
				<div class="field">
					<label for="targetUrl">URL of target page</label>
					<input id="targetUrl" type="text" placeholder="https://octo.dc.gov/biography/about-cto" aria-label="URL of target page" />
				</div>

				<!-- Action button -->
				<div class="field" style="grid-template-columns: 240px auto; margin-top: 20px;">
					<span class="sr-only">Action</span>
					<button type="button" id="runBtn">Find pages linking to this URL</button>
				</div>
			</form>

			<!-- Status -->
			<div id="status" class="status" aria-live="polite"></div>

			<!-- New: aliases considered -->
			<div id="aliasContainer" aria-live="polite"></div>

			<!-- Results table -->
			<table id="results" role="table" aria-label="Results">
				<thead>
					<tr>
						<th>Page URL</th>
						<th>Link text</th>
					</tr>
				</thead>
				<tbody id="resultsBody"></tbody>
			</table>
		</div>
	</main>

	<script>
		// Sorry, this is a mess. Started with AI then I started fixing it.
		const form = document.querySelector("#whatLinksHereForm");
		const targetUrlEl = document.getElementById('targetUrl');
		const btn = document.getElementById('runBtn');
		const statusEl = document.getElementById('status');
		const aliasContainer = document.getElementById('aliasContainer');
		const tableEl = document.getElementById('results');
		const tbodyEl = document.getElementById('resultsBody');

		let data = null;

		const normalize = (u) => (u == null) ? '' : String(u).trim();

		function setStatus(message, type = '') {
			statusEl.textContent = message;
			statusEl.className = `status ${type || ''}`;
		}

		function hideButton() {
			btn.style.display = "none";
		}

		function showButton() {
			btn.style.display = "block";
		}

		function changeToUrlField() {
			if(targetUrlEl.value.trim()) {
				clearResults();
				showButton();
			}
			else {
				hideButton();
			}
		}

		function clearResults() {
			tbodyEl.innerHTML = "";
			tableEl.style.display = "none";
			aliasContainer.innerHTML = ""; // clear aliases display
			setStatus("");
		}

		/** Find the canonical page for targetUrl and return its alias URL set. */
		function resolveAliases(pages, targetUrl) {
			const exact = normalize(targetUrl);
			let aliasSet = null;

			for (const entry of pages) {
				const urls = Array.isArray(entry?.url) ? entry.url : (entry?.url ? [entry.url] : []);
				if (urls.some(u => normalize(u) === exact)) {
					aliasSet = new Set(urls.map(u => normalize(u)));
					break;
				}
			}

			// Fallback: if we didn't find a canonical entry, just match the entered URL
			if (!aliasSet) aliasSet = new Set([exact]);

			return aliasSet;
		}

		/** Show an unordered list of aliases (only when more than one). */
		function renderAliases(aliasSet) {
			aliasContainer.innerHTML = '';
			if (!aliasSet || aliasSet.size <= 1) return;

			const p = document.createElement('p');
			p.textContent = 'Aliases considered:';
			const ul = document.createElement('ul');
			for (const u of aliasSet) {
				const li = document.createElement('li');
				li.textContent = u;
				ul.appendChild(li);
			}
			aliasContainer.appendChild(p);
			aliasContainer.appendChild(ul);
		}

		async function getJsonData(agencyInitials) {
			hideButton();
			const fileNameAndPath = "./" + agencyInitials + "_in_content_links.json";
			try {
				const response = await fetch(fileNameAndPath); // Fetches the file
				data = await response.json();					// Automatically parses JSON
			} catch (error) {
				setStatus("Error loading JSON from " + fileNameAndPath, 'warn');
				console.error("Error loading JSON:", error);
			}
		}

		
		function getResults() {
			const targetUrl = targetUrlEl.value.trim();
			if (!targetUrl) {
				setStatus('Please enter the URL of the target page to find.', 'warn');
				return;
			}

			btn.disabled = true;
			setStatus('Reading and analyzing data...');

			try {
				const pages = Array.isArray(data?.pages) ? data.pages : [];
				if (pages.length === 0) {
					setStatus('The JSON file does not contain a non-empty "pages" array.', 'warn');
					return;
				}

				// 1) Build alias set from the canonical page that contains targetUrl in its url array
				const aliasSet = resolveAliases(pages, targetUrl);

				// 2) Scan all pages and collect links that match ANY alias URL
				let matches = 0;

				for (const entry of pages) {
					const pageUrls = Array.isArray(entry?.url) ? entry.url : (entry?.url ? [entry.url] : []);
					const pageUrlFirst = normalize(pageUrls[0] || '');

					const links = Array.isArray(entry?.links) ? entry.links : [];
					const matchedLinks = links.filter(l => aliasSet.has(normalize(l?.href)));

					if (matchedLinks.length > 0) {
						const tr = document.createElement('tr');

						// First cell: clickable first page URL (or placeholder)
						const tdUrl = document.createElement('td');
						if (pageUrlFirst) {
							const a = document.createElement('a');
							a.href = pageUrlFirst;
							a.target = '_blank';
							a.rel = 'noopener noreferrer';
							a.textContent = pageUrlFirst;
							tdUrl.appendChild(a);
						} else {
							tdUrl.textContent = '(no page URL)';
						}

						// Second cell: link text(s) for all matched hrefs (unordered list if > 1)
						const tdLinks = document.createElement('td');
						if (matchedLinks.length === 1) {
							tdLinks.textContent = normalize(matchedLinks[0]?.text) || '(no text)';
						} else {
							const ul = document.createElement('ul');
							for (const ml of matchedLinks) {
								const li = document.createElement('li');
								li.textContent = normalize(ml?.text) || '(no text)';
								ul.appendChild(li);
							}
							tdLinks.appendChild(ul);
						}

						tr.appendChild(tdUrl);
						tr.appendChild(tdLinks);
						tbodyEl.appendChild(tr);
						matches += 1;
					}
				}

				// 3) Render status and alias list
				if (matches > 0) {
					tableEl.style.display = 'table';
					const aliasCount = aliasSet.size;
					setStatus(`Found ${matches} page(s) linking to ${aliasCount > 1 ? 'one of the ' + aliasCount + ' aliases' : 'the target URL'}.`, 'ok');
					renderAliases(aliasSet);
				} else {
					setStatus('No pages in the dataset link to the target URL or its aliases.', 'warn');
					renderAliases(aliasSet); // still helpful to show what was considered
				}
			} 
			catch (err) {
				console.error(err);
				setStatus(`Error: ${err.message}`, 'err');
			} 
			finally {
				btn.disabled = false;
			}
		}

		function textPastedToUrlField(e) {
			let pastedText = e.clipboardData.getData('text/plain');
			if(pastedText) {
				showButton();
				clearResults();
			}
		}

		function initialize() {
			hideButton();
			btn.addEventListener('click', getResults);
			targetUrlEl.addEventListener("change", changeToUrlField);
			targetUrlEl.addEventListener("paste", (e) => {
				textPastedToUrlField(e);
			});

			// Read json when agency is selected
			const agencyInitialsFieldset = document.querySelector("#agencyInitialsFieldset");
			let agencyInitials = form.elements['agencyInitials'].value;

			agencyInitialsFieldset.addEventListener("click",(e) => {
				agencyInitials = form.elements['agencyInitials'].value;
				if(agencyInitials) {
					clearResults();
					getJsonData(agencyInitials);
				}
			});

			// If page was reloaded and agency is already set, load the json
			if(agencyInitials) {
				getJsonData(agencyInitials);
			}
		};

		document.addEventListener("DOMContentLoaded", function(){
			initialize();
		});
	</script>
</body>
</html>
